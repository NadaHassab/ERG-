# Plan §35 item 19 (external variant): joint label-free SSL over four
# domains (LEOP + PERG + URFU + FLINDERS external binding).  Existing e7
# (LEOP+PERG) stays untouched; this is the "data increase" comparison arm
# (plan integration §11).  One outer fold is always excluded (plan §23.6).
# plan_per_epoch regenerates the permutation each epoch so the larger
# external pool is actually revisited.
name: e9_ssl_pretrain_external_v1
fold_version: v1
routing_graph: correct
outer_folds: [0, 1, 2, 3, 4]
exclude_fold: null
leop_batch: 64
perg_batch: 64
epochs: 5
lr: 0.0001
weight_decay: 0.05
warmup_epochs: 1
grad_clip: 1.0
seed: 1001
device: cuda
mask_len: 24
ssl_dim: 64
lambda_mask: 1.0
lambda_view: 0.25
lambda_aug: 0.25
lambda_geom: 0.10
lambda_prior: 0.01
gate_prior: 0.75
output_subdir: ssl_pretrain_external_v1
log_every: 10
ssl_datasets: [LEOP, PERG, URFU, FLINDERS]
domain_batches: {LEOP: 64, PERG: 64, URFU: 64, FLINDERS: 32}
plan_per_epoch: true
external_bindings: [external_v1]
external_fold_version: external_v1