# E4 classical baselines on the LEOP secondary all-protocols cohort (plan
# 16.6): every eligible subject, every protocol used EXPLICITLY (protocols are
# never merged by averaging), plus the protocol/availability/QC shortcut
# baselines for confound quantification. The full 9-step/2-step/LA3 protocol
# counts are logged in the run notes; per-protocol slot features arrive in
# Phase 2.
name: e4_baselines_v2_leop_secondary_all_protocols_p7
fold_version: v1
datasets: ["LEOP"]
leop_cohort: secondary_all_protocols
e0_methods: ["prevalence", "metadata", "availability", "quality"]
e4_methods:
  - clinical
  - slot
  - pca_fpca
  - raw_rbf
  - scdt
  - derot_lr
  - derot_rbf
  - scattering
  - spectral
  - slot_sot
demographic_methods:
  - clinical
models: ["logreg", "svm_rbf", "histgb"]
outer_folds: [0, 1, 2, 3, 4]
n_bootstrap_reps: 2000
bootstrap_seed: 424242
confidence: 0.95
pca_variance: 0.95
max_pca_components: 32
seed: 777
legacy: false
use_gpu: false
output_subdir: baselines_v2_leop_secondary_all_protocols_p7_cpu
