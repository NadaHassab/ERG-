# Phase 9 acceptance-gate experiment: light method set so the label-
# permutation reruns (one per seed) finish quickly on GPU. Gates: provenance
# hashes, full metric set + confusion matrices, label-permutation ~= chance.
name: e4_acceptance_gate_p9
fold_version: v1
datasets: ["LEOP"]
leop_cohort: primary_nine_step
e0_methods: ["prevalence", "metadata", "quality"]
e4_methods:
  - clinical
  - slot_sot
  - spectral
demographic_methods: []
models: ["logreg", "svm_rbf", "histgb"]
outer_folds: [0, 1, 2, 3, 4]
n_bootstrap_reps: 2000
bootstrap_seed: 424242
confidence: 0.95
pca_variance: 0.95
max_pca_components: 32
seed: 777
legacy: false
use_gpu: true
output_subdir: baselines_acceptance_gate_p9