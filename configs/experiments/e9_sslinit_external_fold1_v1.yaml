# Phase 7 (external arm): supervised fine-tuning of LEOP/PERG initialized
# from the four-domain SSL checkpoint (ssl_pretrain_external_v1), the
# "data increase" comparison vs e6_sslinit_* (two-domain SSL).  Only this
# fold's runs execute; the summary pass with all folds and --resume rebuilds
# the 5-fold ensemble from the shared output_subdir.
name: e9_sslinit_external_fold1_v1
method: separate_raw_ot_hierarchical_sslinit_external_v1
fold_version: v1
tasks: [LEOP, PERG]
leop_cohort: primary_nine_step
outer_folds: [1]
seeds: [1001, 2002, 3003]
epochs: 200
batch_size: 8
lr: 0.0001
weight_decay: 0.0001
warmup_epochs: 5
patience: 25
grad_clip: 1.0
device: cuda
max_steps_per_epoch: null
output_subdir: separate_raw_ot_hierarchical_sslinit_external_v1
n_bootstrap_reps: 2000
bootstrap_seed: 424242
confidence: 0.95
init_ssl: artifacts/results/ssl_pretrain_external_v1/fold1/final.pt
routing_graph: correct
label_frac: 1.0
subset_seed: 9001
resume: false
external_bindings: [external_v1]
external_fold_version: external_v1