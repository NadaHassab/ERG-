# e9 smoke: 1-epoch real 4-domain SSL run over real artifacts (smoke only).
name: e9_ssl_pretrain_external_v1_smoke
fold_version: v1
routing_graph: correct
outer_folds: [0, 1, 2, 3, 4]
exclude_fold: null
leop_batch: 64
perg_batch: 64
epochs: 1
lr: 0.0001
weight_decay: 0.05
warmup_epochs: 0
grad_clip: 1.0
seed: 1001
device: cuda
mask_len: 24
ssl_dim: 64
lambda_mask: 1.0
lambda_view: 0.25
lambda_aug: 0.25
lambda_geom: 0.10
lambda_prior: 0.01
gate_prior: 0.75
output_subdir: ssl_pretrain_external_v1_smoke
log_every: 10
ssl_datasets: [LEOP, PERG, URFU, FLINDERS]
domain_batches: {LEOP: 64, PERG: 64, URFU: 64, FLINDERS: 32}
plan_per_epoch: true
external_bindings: [external_v1]
external_fold_version: external_v1
