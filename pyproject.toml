[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathway-erg"
version = "0.1.0"
description = "Pathway-Constrained Partial Transfer Across Unpaired Retinal Electrophysiology Protocols"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1,<3",
    "pyarrow>=14",
    "zarr>=3",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "PyYAML>=6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "PyWavelets>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
